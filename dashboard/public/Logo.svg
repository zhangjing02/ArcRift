<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="chronosCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mindPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hourglass Outer Frame -->
  <path d="M 8 6 L 32 6 L 24 19 L 32 34 L 8 34 L 16 19 Z" 
        stroke="url(#chronosCyan)" 
        stroke-width="2" 
        stroke-linejoin="round" 
        fill="rgba(56, 189, 248, 0.05)"
        filter="url(#glow)"/>

  <!-- Horizontal Bounds -->
  <line x1="6" y1="6" x2="34" y2="6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6" y1="34" x2="34" y2="34" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Upper Sand / Neural Constellation -->
  <circle cx="20" cy="11" r="1.5" fill="#38bdf8"/>
  <circle cx="16" cy="14" r="1.2" fill="#38bdf8"/>
  <circle cx="24" cy="14" r="1.2" fill="#38bdf8"/>
  <line x1="20" y1="11" x2="16" y2="14" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="11" x2="24" y2="14" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="14" x2="20" y2="19" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="24" y1="14" x2="20" y2="19" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

  <!-- Lower AI Mind Crystal / Brain Core -->
  <polygon points="20,23 24,26 24,30 20,32 16,30 16,26" 
           fill="url(#mindPurple)" 
           stroke="#ffffff" 
           stroke-width="1"
           filter="url(#glow)"/>
  
  <circle cx="20" cy="27.5" r="1.5" fill="#ffffff"/>
  <line x1="20" y1="19" x2="20" y2="23" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="1 1"/>
</svg>
